# Whole system: `docker compose up --build`
x-aws: &aws
  AWS_ENDPOINT_URL: http://ministack:4566
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}

x-after-init: &after-init
  stop_grace_period: 20s # > SQS long poll (10s): consumers finish the last poll before exiting
  depends_on:
    infra-init:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  ministack:
    image: ministackorg/ministack:1.5.40
    ports: ["4566:4566"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  infra-init:
    image: amazon/aws-cli:2.39.0
    entrypoint: ["bash", "/init/init.sh"]
    environment: *aws
    volumes: ["./infra/init:/init:ro"]
    depends_on:
      ministack:
        condition: service_healthy

  call-signaling:
    <<: *after-init
    build: ./services/call-signaling
    ports: ["8081:8080"]
    environment:
      <<: *aws
      SERVICE_NAME: call-signaling
      MAX_PARTICIPANTS: ${MAX_PARTICIPANTS:-10}
      RELAY_TIMEOUT_MS: ${RELAY_TIMEOUT_MS:-3000}
      CALL_EVENTS_TOPIC_ARN: arn:aws:sns:${AWS_REGION:-us-east-1}:000000000000:call-events
      RELAY_REQUESTS_QUEUE: relay-requests
      RELAY_RESULTS_QUEUE: relay-results
      CALLS_TABLE: signaling-calls
      USERS_TABLE: signaling-users
      OUTBOX_TABLE: signaling-outbox
      PROCESSED_TABLE: signaling-processed
      ACCOUNTS_TABLE: signaling-accounts
      REFRESH_TABLE: signaling-refresh
      JWT_KEY_SECRET: larpspeak/jwt-key
      ACCESS_TOKEN_TTL_S: ${ACCESS_TOKEN_TTL_S:-300}
      REFRESH_TTL_S: ${REFRESH_TTL_S:-604800}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}

  web:
    build: ./web
    ports: ["8080:80", "8443:443"] # 8443 = HTTPS when web/certs exists (make certs); mic on other machines needs it
    volumes: ["./web/certs:/etc/nginx/certs:ro"]
    environment:
      SIGNALING_URL: http://call-signaling:8080
    depends_on: [call-signaling]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  media-relay:
    <<: *after-init
    build: ./services/media-relay
    deploy:
      replicas: ${MEDIA_RELAY_REPLICAS:-2}
    environment:
      <<: *aws
      SERVICE_NAME: media-relay
      RELAY_LATENCY_MS: ${RELAY_LATENCY_MS:-200}
      RELAY_FAILURE_RATE: ${RELAY_FAILURE_RATE:-0.0}
      PARTICIPANT_TIMEOUT_MS: ${PARTICIPANT_TIMEOUT_MS:-15000}
      UDP_PORT: "40000"
      WEBRTC_UDP_PORT: "50000"
      SIGNALING_URL: http://call-signaling:8080
      RELAY_REQUESTS_QUEUE: relay-requests
      RELAY_RESULTS_QUEUE: relay-results
      CALL_EVENTS_QUEUE: media-relay-call-events
      SESSIONS_TABLE: relay-sessions
      NODES_TABLE: relay-nodes
      OUTBOX_TABLE: relay-outbox
      PROCESSED_TABLE: relay-processed
      AUDIO_CHUNKS_QUEUE: audio-chunks # call recording (browser audio) -> audit-vault; unset = off
      AUDIO_CHUNK_MS: ${AUDIO_CHUNK_MS:-5000}

  audit-vault:
    <<: *after-init
    build: ./services/audit-vault
    deploy:
      replicas: ${AUDIT_VAULT_REPLICAS:-2} # competing consumers on both queues (R4, F8)
    ports: ["8083-8084:8080"] # one host port per replica; widen the range when scaling above 2
    environment:
      <<: *aws
      SERVICE_NAME: audit-vault
      CALL_EVENTS_QUEUE: audit-vault-call-events
      AUDIT_TABLE: audit-records
      PROCESSED_TABLE: audit-processed
      AUDIO_CHUNKS_QUEUE: audio-chunks
      AUDIT_API_TOKEN: ${AUDIT_API_TOKEN:-larpspeak-audit-demo} # Bearer token for GET /audit/*; /health is open
      AUDIO_BUCKET: larpspeak-audio
      AUDIO_KEY_SECRET: larpspeak/audio-key
